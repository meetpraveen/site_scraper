[project]
name = "site-scraper"
version = "0.1.0"
description = "Guarded webapp crawler with UI/network extraction to DuckDB and Parquet plus generated-site scaffolding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "duckdb>=1.1.3",
    "fastmcp>=2.0",
    "httpx>=0.27.2",
    "lxml>=5.3.0",
    "pandas>=2.2.3",
    "playwright>=1.49.0",
    "polars>=1.17.1",
    "pyarrow>=18.1.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "selectolax>=0.3.26",
    "tenacity>=9.0.0",
    "tldextract>=5.1.3",
    "typer>=0.15.1",
    "xxhash>=3.5.0"
]

[project.optional-dependencies]
generated-site = ["fastapi>=0.115.6", "reflex>=0.6.6", "uvicorn>=0.32.1"]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.24.0", "ruff>=0.8.3"]

[project.scripts]
site-scraper = "site_scraper.cli:app"
site-scraper-mcp = "site_scraper.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
